services:
  postgres:
    image: postgres:17-alpine
    container_name: control-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-control_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-control_admin_dev}
      TZ: ${TZ:-America/Panama}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-control_admin} -d ${POSTGRES_DB:-control_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: control-dashboard-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mendotech.lat}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
